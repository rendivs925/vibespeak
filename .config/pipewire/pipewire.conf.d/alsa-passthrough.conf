# Allow ALSA passthrough for applications that need direct ALSA access
# This is needed for applications using CPAL or similar libraries

context.modules = [
    {
        name = libpipewire-module-protocol-native
    }
    {
        name = libpipewire-module-client-node
    }
    {
        name = libpipewire-module-adapter
    }
    {
        name = libpipewire-module-metadata
    }
    # Allow ALSA passthrough
    {
        name = libpipewire-module-protocol-pulse
        args = {
            # Enable ALSA passthrough
            alsa.passthrough = true
        }
    }
]