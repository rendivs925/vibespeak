[commands]

# ============================================================
# ULTIMATE DAILY DRIVER COMMAND MAP (i3 + tmux + terminal + nvim)
# Naming rules:
#   tmux ...       -> tmux actions
#   dev ...        -> project workflows
#   term ...       -> shell actions (typed into focused terminal)
#   nvim ...       -> neovim actions
#   i3 ...         -> window manager actions
#   nav ...        -> browser navigation keys
#   app ...        -> launch apps
#   scroll ...     -> page/line scrolling
# ============================================================


# ============================================================
# TMUX CONTROL (pane/window)
# Prefix assumed: Ctrl+a (as in your current setup)
# ============================================================

# --- Pane splits ---
"tmux split right"           = "xdotool key ctrl+a bar"
"tmux split down"            = "xdotool key ctrl+a minus"

# --- Pane focus (vim-style) ---
"tmux focus left"            = "xdotool key ctrl+a h"
"tmux focus down"            = "xdotool key ctrl+a j"
"tmux focus up"              = "xdotool key ctrl+a k"
"tmux focus right"           = "xdotool key ctrl+a l"

# --- Pane resize (Shift+vim-style) ---
"tmux resize left"           = "xdotool key ctrl+a H"
"tmux resize down"           = "xdotool key ctrl+a J"
"tmux resize up"             = "xdotool key ctrl+a K"
"tmux resize right"          = "xdotool key ctrl+a L"

# --- Pane utilities ---
"tmux toggle zoom"           = "xdotool key ctrl+a m"
"tmux copy mode"             = "xdotool key ctrl+a i"

# --- Pane jump (keep only if you use it often) ---
"tmux pane 0"                = "xdotool key ctrl+a 0"
"tmux pane 1"                = "xdotool key ctrl+a 1"
"tmux pane 2"                = "xdotool key ctrl+a 2"
"tmux pane 3"                = "xdotool key ctrl+a 3"
"tmux pane 4"                = "xdotool key ctrl+a 4"
"tmux pane 5"                = "xdotool key ctrl+a 5"
"tmux pane 6"                = "xdotool key ctrl+a 6"
"tmux pane 7"                = "xdotool key ctrl+a 7"
"tmux pane 8"                = "xdotool key ctrl+a 8"
"tmux pane 9"                = "xdotool key ctrl+a 9"

# --- Window controls ---
"tmux new window"            = "xdotool key ctrl+a c"
"tmux next window"           = "xdotool key ctrl+a n"
"tmux previous window"       = "xdotool key ctrl+a p"
"tmux reload config"         = "xdotool key ctrl+a r"


# ============================================================
# DEV WORKFLOWS (tmux send-keys into target panes/windows)
# Adjust -t targets to match your tmux layout
# ============================================================

# Rust/Leptos
"dev leptos watch"           = "tmux send-keys -t 1 'cargo leptos watch' C-m"
"dev cargo check"            = "tmux send-keys -t 1 'cargo check' C-m"
"dev cargo test"             = "tmux send-keys -t 1 'cargo test' C-m"
"dev cargo format"           = "tmux send-keys -t 1 'cargo fmt' C-m"
"dev cargo clippy"           = "tmux send-keys -t 1 'cargo clippy' C-m"

# Frontend
"dev frontend dev"           = "tmux send-keys -t 2 'yarn dev' C-m"
"dev frontend build"         = "tmux send-keys -t 2 'yarn build' C-m"
"dev frontend test"          = "tmux send-keys -t 2 'yarn test' C-m"

# Stop running processes
"dev stop process in pane 1" = "tmux send-keys -t 1 C-c"
"dev stop process in pane 2" = "tmux send-keys -t 2 C-c"


# ============================================================
# SHELL (typed into currently focused terminal window)
# ============================================================

# --- Basics ---
"term clear"                 = "xdotool type 'clear'; xdotool key Return"
"term list files"            = "xdotool type 'ls -la'; xdotool key Return"
"term show tree"             = "xdotool type 'tree -L 2'; xdotool key Return"
"term show history"          = "xdotool type 'history | tail -n 50'; xdotool key Return"
"term show processes"        = "xdotool type 'htop'; xdotool key Return"
"term show system info"      = "xdotool type 'fastfetch'; xdotool key Return"

# --- Git daily ---
"git status"                 = "xdotool type 'git status'; xdotool key Return"
"git diff"                   = "xdotool type 'git diff'; xdotool key Return"
"git log"                    = "xdotool type 'git log --oneline --decorate -n 20'; xdotool key Return"
"git pull"                   = "xdotool type 'git pull'; xdotool key Return"
"git push"                   = "xdotool type 'git push'; xdotool key Return"
"git commit message"         = "xdotool type 'git commit -m \"\"'; xdotool key Left"


# ============================================================
# ALACRITTY FONT ZOOM
# ============================================================

"term zoom in"               = "xdotool key ctrl+KP_Add"
"term zoom out"              = "xdotool key ctrl+minus"
"term reset zoom"            = "xdotool key ctrl+0"


# ============================================================
# i3 WINDOW MANAGER (COMPREHENSIVE WORKSPACES 1-9 and 0 + next/previous)
# Note: i3 commonly maps "10" to the "0" key workspace.
# ============================================================

# --- Workspaces: focus (1..9, 0) ---
"i3 workspace 1"             = "i3-msg workspace 1"
"i3 workspace 2"             = "i3-msg workspace 2"
"i3 workspace 3"             = "i3-msg workspace 3"
"i3 workspace 4"             = "i3-msg workspace 4"
"i3 workspace 5"             = "i3-msg workspace 5"
"i3 workspace 6"             = "i3-msg workspace 6"
"i3 workspace 7"             = "i3-msg workspace 7"
"i3 workspace 8"             = "i3-msg workspace 8"
"i3 workspace 9"             = "i3-msg workspace 9"
"i3 workspace 0"             = "i3-msg workspace 10"

# --- Workspaces: next/previous ---
"i3 next workspace"          = "i3-msg workspace next"
"i3 previous workspace"      = "i3-msg workspace prev"

# --- Move focused container to workspace (1..9, 0) ---
"i3 move container to workspace 1" = "i3-msg move container to workspace 1"
"i3 move container to workspace 2" = "i3-msg move container to workspace 2"
"i3 move container to workspace 3" = "i3-msg move container to workspace 3"
"i3 move container to workspace 4" = "i3-msg move container to workspace 4"
"i3 move container to workspace 5" = "i3-msg move container to workspace 5"
"i3 move container to workspace 6" = "i3-msg move container to workspace 6"
"i3 move container to workspace 7" = "i3-msg move container to workspace 7"
"i3 move container to workspace 8" = "i3-msg move container to workspace 8"
"i3 move container to workspace 9" = "i3-msg move container to workspace 9"
"i3 move container to workspace 0" = "i3-msg move container to workspace 10"

# --- Focus directions ---
"i3 focus left"              = "i3-msg focus left"
"i3 focus right"             = "i3-msg focus right"
"i3 focus up"                = "i3-msg focus up"
"i3 focus down"              = "i3-msg focus down"

# --- Move container directions ---
"i3 move container left"     = "i3-msg move left"
"i3 move container right"    = "i3-msg move right"
"i3 move container up"       = "i3-msg move up"
"i3 move container down"     = "i3-msg move down"

# --- Layout / window state ---
"i3 toggle fullscreen"       = "i3-msg fullscreen toggle"
"i3 toggle floating"         = "i3-msg floating toggle"
"i3 float and center window" = "i3-msg floating enable, resize set 1720 1020, move position center"

"i3 split horizontally"      = "i3-msg split h"
"i3 split vertically"        = "i3-msg split v"
"i3 set layout tabbed"       = "i3-msg layout tabbed"
"i3 set layout stacking"     = "i3-msg layout stacking"
"i3 toggle split layout"     = "i3-msg layout toggle split"

# --- Reload / restart / kill ---
"i3 close window"            = "i3-msg kill"
"i3 reload configuration"    = "i3-msg reload"
"i3 restart i3"              = "i3-msg restart"

# --- Gaps (requires i3-gaps; harmless if unsupported) ---
"i3 increase inner gaps"     = "i3-msg gaps inner current plus 5"
"i3 decrease inner gaps"     = "i3-msg gaps inner current minus 5"
"i3 increase outer gaps"     = "i3-msg gaps outer current plus 5"
"i3 decrease outer gaps"     = "i3-msg gaps outer current minus 5"

# --- System ---
"i3 lock screen"             = "i3lock"


# ============================================================
# BROWSER NAVIGATION (works in most browsers)
# ============================================================

"nav open new tab"           = "xdotool key ctrl+t"
"nav close current tab"      = "xdotool key ctrl+w"
"nav go to next tab"         = "xdotool key ctrl+Tab"
"nav go to previous tab"     = "xdotool key ctrl+shift+Tab"
"nav focus address bar"      = "xdotool key ctrl+l"
"nav refresh page"           = "xdotool key ctrl+r"
"nav go back"                = "xdotool key alt+Left"
"nav go forward"             = "xdotool key alt+Right"


# ============================================================
# SCROLLING (generic, works almost everywhere)
# ============================================================

"scroll down a bit"          = "for i in {1..10}; do xdotool key Down; done"
"scroll up a bit"            = "for i in {1..10}; do xdotool key Up; done"
"scroll one page down"       = "xdotool key space"
"scroll one page up"         = "xdotool key shift+space"
"scroll to end"              = "xdotool key End"
"scroll to home"             = "xdotool key Home"


# ============================================================
# NEOVIM
# ============================================================

"nvim open editor"           = "xdotool type 'nvim'; xdotool key Return"

"nvim save file"             = "xdotool key Escape colon w Return"
"nvim save all files"        = "xdotool key Escape colon wa Return"
"nvim quit file"             = "xdotool key Escape colon q Return"
"nvim quit all files"        = "xdotool key Escape colon qa Return"

"nvim find file"             = "xdotool key space f f"
"nvim search text"           = "xdotool key Escape slash"

"nvim go to normal mode"     = "xdotool key Escape"
"nvim go to insert mode"     = "xdotool key i"
"nvim go to visual mode"     = "xdotool key v"

"nvim page down"             = "xdotool key ctrl+d"
"nvim page up"               = "xdotool key ctrl+u"

"nvim go to next buffer"     = "xdotool key Escape colon b n Return"
"nvim go to previous buffer" = "xdotool key Escape colon b p Return"
"nvim close current buffer"  = "xdotool key Escape colon b d Return"


# ============================================================
# APPS / LAUNCHERS
# ============================================================

"app open terminal"          = "alacritty"
"app open browser"           = "google-chrome-stable"
"app open menu"              = "dmenu_run"
"app open file manager"      = "ranger"
