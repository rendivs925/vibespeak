<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .button {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .button.primary {
            background: #007bff;
            color: white;
        }

        .button.primary:hover {
            background: #0056b3;
        }

        .button.secondary {
            background: #6c757d;
            color: white;
        }

        .button.secondary:hover {
            background: #545b62;
        }

        .status {
            padding: 8px;
            margin: 8px 0;
            border-radius: 4px;
            font-size: 12px;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.inactive {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <h3 style="margin: 0 0 10px 0;">🎤 Vibespeak Dictation</h3>

    <div id="status" class="status inactive">
        Dictation inactive
    </div>

    <button id="toggle-dictation" class="button primary">
        Start Dictation
    </button>

    <button id="stop-dictation" class="button secondary" style="display: none;">
        Stop Dictation
    </button>

    <div style="margin-top: 10px; font-size: 12px; color: #666;">
        <p><strong>Shortcut:</strong> Ctrl+Shift+D</p>
        <p><strong>Works in:</strong></p>
        <ul style="margin: 5px 0; padding-left: 15px;">
            <li>Text inputs</li>
            <li>Text areas</li>
            <li>Content editable</li>
            <li>Code editors</li>
        </ul>
    </div>

    <script src="popup.js"></script>
</body>
</html>
